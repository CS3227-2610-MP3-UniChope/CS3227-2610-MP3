name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['src/frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
